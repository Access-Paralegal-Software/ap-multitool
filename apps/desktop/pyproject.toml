[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ap-multitool-desktop"
version = "1.0.0"
description = "Desktop Qt application for AP Multitool Legal Suite"
requires-python = ">=3.12"
dependencies = [
    "ap-core",
    "doc-chameleon",
    "PySide6>=6.6.0",
]

[project.optional-dependencies]
packaging = [
    "pyinstaller>=6.4.0",
]

[tool.uv.sources]
ap-core = { workspace = true }
doc-chameleon = { workspace = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["apmultitool_qt*"]
