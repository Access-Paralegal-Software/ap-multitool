[package]
name = "ap-desktop"
version = "0.1.0"
description = "AP-Suite Desktop Application (Tauri v2)"
edition = "2021"

[lib]
name = "ap_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
