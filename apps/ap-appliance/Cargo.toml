[package]
name = "ap-appliance"
version = "0.1.0"
edition = "2021"
description = "Headless local engine daemon powered by Axum and Tokio for AP-Suite"

[dependencies]
axum = "0.7"
tokio = { version = "1.37", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
