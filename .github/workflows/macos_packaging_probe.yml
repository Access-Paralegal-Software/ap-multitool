# macos_packaging_probe.yml — APMultitool macOS CI Packaging Probe
#
# PIPELINE MODES
#   Probe mode (default): secrets absent → unsigned DMG only. Never fails due to
#   missing secrets; clearly logs the mode so operators can diagnose CI state.
#   Activated mode: all 5 secrets present → full sign/notarize/staple pipeline.
#
# GATING: Not triggered on every push to master (macOS runners bill at ~10x Linux).
#   Runs on manual dispatch or push to release/** branches.
#
# SECRETS DRY-RUN: Step 1 checks secret presence and logs the pipeline mode
#   without using or echoing any secret values.
#
# See docs/ops/macos_secrets_activation_checklist.md to provision secrets.
# See docs/ops/macos_packaging_overview.md for the full pipeline reference.

name: macOS Packaging Probe

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: 'App version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'
      release_channel:
        description: 'Release channel suffix (e.g. -alpha1)'
        required: false
        default: '-alpha1'
  push:
    branches:
      - 'release/**'

jobs:
  macos-package-probe:
    name: macOS Package Probe
    runs-on: macos-latest

    steps:

      # ── Phase 1: Secrets dry-run validation ────────────────────────────────
      # Checks secret presence using boolean expressions — no secret values
      # are used or echoed. Sets MACOS_SIGNING_ACTIVE for log readability.
      # This step always passes; missing secrets are not an error in probe mode.

      - name: Check macOS signing secrets (dry-run validation)
        env:
          HAS_CERT:     ${{ secrets.APPLE_DEV_ID_CERT != '' }}
          HAS_CERT_PWD: ${{ secrets.APPLE_DEV_ID_CERT_PASSWORD != '' }}
          HAS_TEAM_ID:  ${{ secrets.APPLE_TEAM_ID != '' }}
          HAS_APPLE_ID: ${{ secrets.APPLE_APPLE_ID != '' }}
          HAS_APP_PWD:  ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}
        run: |
          echo "=== macOS Signing Secrets Dry-Run Check ==="
          echo "  APPLE_DEV_ID_CERT           present: $HAS_CERT"
          echo "  APPLE_DEV_ID_CERT_PASSWORD  present: $HAS_CERT_PWD"
          echo "  APPLE_TEAM_ID               present: $HAS_TEAM_ID"
          echo "  APPLE_APPLE_ID              present: $HAS_APPLE_ID"
          echo "  APPLE_APP_SPECIFIC_PASSWORD present: $HAS_APP_PWD"
          echo ""
          if [ "$HAS_CERT" = "true" ] && \
             [ "$HAS_CERT_PWD" = "true" ] && \
             [ "$HAS_TEAM_ID" = "true" ] && \
             [ "$HAS_APPLE_ID" = "true" ] && \
             [ "$HAS_APP_PWD" = "true" ]; then
            echo "✅ All macOS signing secrets present — pipeline will run in ACTIVATED mode."
            echo "   Signing and notarization steps will execute after the build."
            echo "MACOS_SIGNING_ACTIVE=true" >> $GITHUB_ENV
          else
            echo "⚠️  One or more macOS signing secrets are missing."
            echo "   Pipeline running in UNSIGNED PROBE MODE — build and DMG only."
            echo "   To activate signing/notarization, follow:"
            echo "   docs/ops/macos_secrets_activation_checklist.md"
            echo "MACOS_SIGNING_ACTIVE=false" >> $GITHUB_ENV
          fi

      # ── Phase 2: Setup ──────────────────────────────────────────────────────

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install workspace
        run: uv sync --all-packages --extra packaging

      # ── Phase 3: Build (ACTIVE — unsigned probe mode) ───────────────────────

      - name: Make build script executable
        run: chmod +x packaging/macos/build_app.sh

      - name: Run macOS build (unsigned — probe mode)
        # Signing identity, Team ID, Apple ID, and password are intentionally
        # omitted. build_app.sh detects their absence, logs probe mode, and
        # produces an unsigned DMG. See SIGNING_HOOK and NOTARIZATION_HOOK
        # comments in packaging/macos/build_app.sh.
        run: |
          uv run bash packaging/macos/build_app.sh \
            "${{ github.event.inputs.app_version || '1.0.0' }}" \
            "${{ github.event.inputs.release_channel || '-alpha1' }}"

      - name: Upload unsigned DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-unsigned
          path: dist/*.dmg
          if-no-files-found: warn

      # ── Phase 4: Certificate import (FUTURE — inactive until secrets configured) ──
      #
      # These steps are guarded behind GitHub Actions secret existence checks.
      # They silently skip when secrets are absent. The dry-run check above (Phase 1)
      # logs exactly which secrets are missing.
      # Configure secrets per docs/ops/macos_secrets_activation_checklist.md.

      - name: "[FUTURE] Import Developer ID certificate into ephemeral keychain"
        # INACTIVE: Requires APPLE_DEV_ID_CERT and APPLE_DEV_ID_CERT_PASSWORD.
        # Creates a temporary keychain scoped to this runner job only.
        if: env.MACOS_SIGNING_ACTIVE == 'true'
        env:
          APPLE_DEV_ID_CERT:          ${{ secrets.APPLE_DEV_ID_CERT }}
          APPLE_DEV_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEV_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASS=$(openssl rand -hex 16)

          echo "$APPLE_DEV_ID_CERT" | base64 --decode -o "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          security import "$RUNNER_TEMP/cert.p12" \
            -P "$APPLE_DEV_ID_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASS=$KEYCHAIN_PASS" >> $GITHUB_ENV

      # ── Phase 5: Codesign (FUTURE — inactive until signing secrets configured) ──

      - name: "[FUTURE] Codesign app bundle and CLI binary (Hardened Runtime)"
        # INACTIVE: Requires APPLE_DEV_ID_CERT and APPLE_TEAM_ID.
        # Corresponds to SIGNING_HOOK in build_app.sh.
        if: env.MACOS_SIGNING_ACTIVE == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          SIGN_IDENTITY="Developer ID Application: Access Paralegal Systems LLC ($APPLE_TEAM_ID)"
          GUI_APP="dist/Access_Paralegal_Multitool.app"
          CLI_EXE="dist/apmultitool"

          find "$GUI_APP" -type f \( -name "*.so" -o -name "*.dylib" -o -name "Python" \) | \
            while read -r lib; do
              codesign --force --options runtime --sign "$SIGN_IDENTITY" "$lib"
            done

          codesign --force --options runtime --sign "$SIGN_IDENTITY" "$CLI_EXE"
          codesign --force --options runtime --deep --sign "$SIGN_IDENTITY" "$GUI_APP"
          codesign --verify --verbose=2 "$GUI_APP"

          VERSION="${{ github.event.inputs.app_version || '1.0.0' }}"
          CHANNEL="${{ github.event.inputs.release_channel || '-alpha1' }}"
          STAGE_DIR="dist/dmg_stage_signed"
          mkdir -p "$STAGE_DIR"
          cp -R "$GUI_APP" "$STAGE_DIR/"
          ln -s /Applications "$STAGE_DIR/Applications"
          SIGNED_DMG="dist/APMultitool_Setup_v${VERSION}${CHANNEL}_signed.dmg"
          hdiutil create -volname "APMultitool Installer" \
            -srcfolder "$STAGE_DIR" -ov -format UDZO "$SIGNED_DMG"
          rm -rf "$STAGE_DIR"
          echo "SIGNED_DMG=$SIGNED_DMG" >> $GITHUB_ENV

      # ── Phase 6: Notarization (FUTURE — inactive until all notarization secrets configured) ──
      # Corresponds to NOTARIZATION_HOOK in build_app.sh.

      - name: "[FUTURE] Submit signed DMG to Apple notarytool"
        # INACTIVE: Requires all 4 notarization secrets.
        if: env.MACOS_SIGNING_ACTIVE == 'true'
        env:
          APPLE_TEAM_ID:              ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APPLE_ID:             ${{ secrets.APPLE_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool submit "${{ env.SIGNED_DMG }}" \
            --apple-id "$APPLE_APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: "[FUTURE] Staple notarization ticket to DMG"
        # INACTIVE: Stapling embeds the ticket so Gatekeeper verifies offline.
        if: env.MACOS_SIGNING_ACTIVE == 'true'
        run: |
          xcrun stapler staple "${{ env.SIGNED_DMG }}"

      - name: "[FUTURE] Upload signed and notarized DMG artifact"
        # INACTIVE: Uploads the final notarized artifact.
        if: env.MACOS_SIGNING_ACTIVE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-signed-notarized
          path: dist/*_signed.dmg
          if-no-files-found: warn
