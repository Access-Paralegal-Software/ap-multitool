name: "🍏 Build macOS DMG"

# Builds unsigned macOS DMG on every push to master and on version tags.
# Signing and notarization activate when SIGN_IDENTITY / Apple secrets are set.
# R2 upload activates when R2_ACCESS_KEY_ID is set.

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build DMG (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      R2_UPLOAD_ENABLED: ${{ secrets.R2_ACCESS_KEY_ID != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install workspace
        run: uv sync --all-packages --extra packaging

      - name: Parse version from tag (or default)
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            # Split e.g. "1.0.0-beta2" into APP_VERSION=1.0.0 CHANNEL=-beta2
            APP_VERSION="${TAG%%-*}"
            CHANNEL_SUFFIX="-${TAG#*-}"
            [ "$CHANNEL_SUFFIX" = "-$TAG" ] && CHANNEL_SUFFIX=""  # no dash found
          else
            APP_VERSION="1.0.0"
            CHANNEL_SUFFIX="-beta1"
          fi
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL_SUFFIX" >> "$GITHUB_OUTPUT"
          echo "full_version=v${APP_VERSION}${CHANNEL_SUFFIX}" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          TEAM_ID:        ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID:       ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          uv run bash packaging/macos/build_app.sh \
            "${{ steps.version.outputs.app_version }}" \
            "${{ steps.version.outputs.channel }}" \
            "${SIGN_IDENTITY:-}" \
            "${TEAM_ID:-}" \
            "${APPLE_ID:-}" \
            "${APPLE_APP_PASSWORD:+APPLE_APP_PASSWORD}"

      - name: Locate DMG
        id: dmg
        run: |
          DMG=$(ls dist/APMultitool_Setup_*.dmg | head -1)
          echo "path=$DMG" >> "$GITHUB_OUTPUT"
          echo "name=$(basename $DMG)" >> "$GITHUB_OUTPUT"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dmg.outputs.name }}
          path: ${{ steps.dmg.outputs.path }}
          retention-days: 30

      - name: Upload to Cloudflare R2
        if: env.R2_UPLOAD_ENABLED == 'true'
        env:
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL:      ${{ secrets.R2_ENDPOINT_URL }}
          DMG_PATH:             ${{ steps.dmg.outputs.path }}
        run: |
          pip install boto3
          python3 - <<'PYEOF'
          import boto3, os
          s3 = boto3.client(
              "s3",
              endpoint_url=os.environ["R2_ENDPOINT_URL"],
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
          )
          dmg = os.environ["DMG_PATH"]
          s3.upload_file(
              dmg,
              "aps-downloads",
              "ap-multitool/macos/APMultitool-macos-beta.dmg",
              ExtraArgs={"ContentType": "application/octet-stream"},
          )
          print(f"✅ Uploaded {dmg} → ap-multitool/macos/APMultitool-macos-beta.dmg")
          PYEOF

      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "${{ steps.dmg.outputs.path }}" \
            --clobber
