# tests.yml — APMultitool CI Test Suite
#
# Runs on every push/PR to master and on manual dispatch.
# Matrix: windows-latest, macos-latest, ubuntu-latest × named test subsets.
#
# Each subset name maps to a pytest marker expression via run_core_tests.py.
# Linux installs xvfb and uses xvfb-run so Qt widget tests can instantiate
# QApplication without a physical display server.
#
# See docs/ops/ci_overview.md for the developer quickstart.
# See docs/ops/ci_known_issues.md for platform-specific caveats.

name: CI Test Suite

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.subset }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        subset: [unit, integration, core, qt, cli, telemetry, packaging]

    steps:
      # ── Setup ──────────────────────────────────────────────────────────────

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install system dependencies (Linux — xvfb for Qt widget tests)
        # xvfb provides a virtual framebuffer so PySide6 can open windows
        # on a headless Linux runner without a real display server.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb libegl1-mesa libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
            libxcb-xfixes0 libgl1-mesa-glx

      - name: Install workspace
        run: uv sync --all-packages

      # ── Test runs ──────────────────────────────────────────────────────────

      - name: Run tests (Windows / macOS)
        # Qt and all other tests run natively on these platforms.
        if: runner.os != 'Linux'
        run: >-
          uv run python scripts/run_core_tests.py
          --subset ${{ matrix.subset }}
          --junit test-results-${{ matrix.os }}-${{ matrix.subset }}.xml

      - name: Run tests with Xvfb (Linux)
        # xvfb-run wraps the process in a virtual framebuffer session.
        # Qt widget tests (--subset qt) can now instantiate QApplication.
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          xvfb-run --auto-servernum
          uv run python scripts/run_core_tests.py
          --subset ${{ matrix.subset }}
          --junit test-results-${{ matrix.os }}-${{ matrix.subset }}.xml

      # ── Artifacts ──────────────────────────────────────────────────────────

      - name: Upload test results
        # Always upload so the JUnit XML is available even on failure.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.subset }}
          path: test-results-*.xml
          if-no-files-found: ignore
