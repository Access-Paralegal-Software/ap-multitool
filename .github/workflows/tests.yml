name: CI Test Suite

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    name: Run Pytest Subsets
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        subset: [unit, integration, core, qt, cli, telemetry, packaging]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk libtk8.6 xvfb libegl1-mesa libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libgl1-mesa-glx

    - name: Install Python Modules
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-qt PySide6 pymupdf reportlab extract-msg cryptography pillow python-docx openpyxl html2text

    - name: Run Tests (Windows / macOS)
      if: runner.os != 'Linux'
      run: |
        python scripts/run_core_tests.py --subset ${{ matrix.subset }}

    - name: Run Tests with Xvfb (Linux)
      if: runner.os == 'Linux'
      run: |
        xvfb-run --auto-servernum python scripts/run_core_tests.py --subset ${{ matrix.subset }}
