name: Cross-Platform Build Master

on:
  push:
    branches:
      - master
  workflow_dispatch: # Allow manual triggering from GitHub UI

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        include:
          - os: macos-latest
            output_name: Access_Paralegal_PDF_Merger.app
          - os: ubuntu-latest
            output_name: Access_Paralegal_PDF_Merger
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk libtk8.6

    - name: Install Python Modules
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter pymupdf reportlab extract-msg cryptography pillow pyinstaller

    - name: Get CustomTkinter Path
      id: tkpath
      run: |
        python -c "import customtkinter; print('TK_PATH=' + customtkinter.__path__[0])" >> $GITHUB_ENV

    - name: Compile Standalone Bundle (macOS)
      if: runner.os == 'macOS'
      run: |
        # Compile MacOS Bundle
        pyinstaller --windowed --noconfirm --add-data="${{ env.TK_PATH }}:customtkinter/" --add-data="logo_small.png:." --name="AccessParalegal" gui_merger.py
        cd dist
        # Package as a standard Apple Disk Image (DMG)
        hdiutil create -volname "Access Paralegal PDF Merger" -srcfolder AccessParalegal.app -ov -format UDZO Access_Paralegal_Mac_Installer.dmg

    - name: Compile Standalone Binary (Linux)
      if: runner.os == 'Linux'
      run: |
        # Linux uses colon separator for add-data
        pyinstaller --windowed --noconfirm --add-data="${{ env.TK_PATH }}:customtkinter/" --add-data="logo_small.png:." --name="AccessParalegal" gui_merger.py
        cd dist
        # Create standard Debian distribution directory structure
        mkdir -p deb_pkg/DEBIAN
        mkdir -p deb_pkg/usr/bin
        cp -r AccessParalegal deb_pkg/usr/bin/
        
        # Generate Debian Control file
        echo "Package: access-paralegal-pdf-merger" > deb_pkg/DEBIAN/control
        echo "Version: 1.8.1" >> deb_pkg/DEBIAN/control
        echo "Section: base" >> deb_pkg/DEBIAN/control
        echo "Priority: optional" >> deb_pkg/DEBIAN/control
        echo "Architecture: amd64" >> deb_pkg/DEBIAN/control
        echo "Depends: python3-tk" >> deb_pkg/DEBIAN/control
        echo "Maintainer: Alan Woodyard" >> deb_pkg/DEBIAN/control
        echo "Description: Secure offline PDF and Email attachment compiler." >> deb_pkg/DEBIAN/control
        
        # Create simple executable script to launch
        echo '#!/bin/bash' > deb_pkg/usr/bin/access-paralegal-pdf-merger
        echo '/usr/bin/AccessParalegal/AccessParalegal "$@"' >> deb_pkg/usr/bin/access-paralegal-pdf-merger
        chmod +x deb_pkg/usr/bin/access-paralegal-pdf-merger
        
        # Premium Upgrade: Compile standard Linux Debian Installer (.deb)
        dpkg-deb --build deb_pkg Access_Paralegal_Linux_Installer.deb

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: ${{ matrix.os }}-build
        path: |
          dist/Access_Paralegal_Mac_Installer.dmg
          dist/Access_Paralegal_Linux_Installer.deb
