<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Container Background -->
  <rect width="512" height="512" rx="112" fill="#071418"/>

  <!-- Outer Bezel Frame -->
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="#00f0ff" stroke-width="14" stroke-opacity="0.9"/>

  <!-- Central Icon Glyph: Vernier Caliper & Scale Jaws (Centered around X=256, Y=210) -->
  <g id="icon-layer" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Horizontal Rule Bar -->
    <rect x="135" y="165" width="242" height="52" rx="6" fill="#0c2530" stroke="#00f0ff" stroke-width="8"/>

    <!-- Rule Graduations / 1/64" Measurement Tics -->
    <line x1="165" y1="165" x2="165" y2="185" stroke="#00f0ff" stroke-width="6"/>
    <line x1="190" y1="165" x2="190" y2="178" stroke="#38bdf8" stroke-width="4"/>
    <line x1="215" y1="165" x2="215" y2="192" stroke="#00f0ff" stroke-width="6"/>
    <line x1="240" y1="165" x2="240" y2="178" stroke="#38bdf8" stroke-width="4"/>
    <line x1="265" y1="165" x2="265" y2="185" stroke="#00f0ff" stroke-width="6"/>
    <line x1="290" y1="165" x2="290" y2="178" stroke="#38bdf8" stroke-width="4"/>
    <line x1="315" y1="165" x2="315" y2="192" stroke="#00f0ff" stroke-width="6"/>
    <line x1="340" y1="165" x2="340" y2="178" stroke="#38bdf8" stroke-width="4"/>

    <!-- Left Fixed Caliper Jaw -->
    <path d="M135 165 V305 L175 240 V217" fill="#00f0ff" stroke="#00f0ff" stroke-width="6"/>

    <!-- Right Sliding Caliper Jaw -->
    <path d="M320 145 H355 V305 L320 240 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="6"/>

    <!-- Tolerance Alignment Target Pip -->
    <circle cx="247" cy="275" r="9" fill="#00f0ff"/>
    <line x1="247" y1="250" x2="247" y2="300" stroke="#00f0ff" stroke-width="4" stroke-dasharray="3 3"/>
  </g>

  <!-- Lower Monogram Pill -->
  <rect x="186" y="380" width="140" height="64" rx="16" fill="#0c2935" stroke="#00f0ff" stroke-width="6"/>
  <text x="256" y="425"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace"
        font-size="34"
        font-weight="900"
        fill="#bbf7d0"
        text-anchor="middle"
        letter-spacing="4">CONV</text>
</svg>
