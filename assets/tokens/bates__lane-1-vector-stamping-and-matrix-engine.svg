<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Container Background -->
  <rect width="512" height="512" rx="112" fill="#08141f"/>

  <!-- Outer Bezel Frame -->
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="#38bdf8" stroke-width="14" stroke-opacity="0.9"/>

  <!-- Central Icon Glyph: Affine Page Compression & Bottom Shelf Bates Stamp -->
  <g id="icon-layer" stroke-linecap="round" stroke-linejoin="round">
    <!-- Unscaled Document Ghost Boundary (100%) -->
    <rect x="156" y="85" width="200" height="235" rx="8" fill="none" stroke="#0284c7" stroke-width="4" stroke-dasharray="8 6" stroke-opacity="0.6"/>
    <!-- Compressed Page (S=0.95, Ty=+36pt Vector Shift) -->
    <rect x="166" y="95" width="180" height="185" rx="6" fill="#0c2338" stroke="#38bdf8" stroke-width="8"/>
    <!-- Pleading Text Stream Vectors -->
    <line x1="188" y1="125" x2="300" y2="125" stroke="#0284c7" stroke-width="6"/>
    <line x1="188" y1="145" x2="324" y2="145" stroke="#0284c7" stroke-width="6"/>
    <line x1="188" y1="165" x2="280" y2="165" stroke="#0284c7" stroke-width="6"/>
    <line x1="188" y1="185" x2="310" y2="185" stroke="#0284c7" stroke-width="6"/>
    <!-- Non-Destructive 0.5" Footer Shelf Clearance Line -->
    <line x1="145" y1="288" x2="367" y2="288" stroke="#0284c7" stroke-width="3" stroke-dasharray="4 4"/>
    <!-- Protected Bates Stamp Burn Box (Bottom-Right CM/ECF Clearance) -->
    <rect x="238" y="296" width="120" height="34" rx="4" fill="#0369a1" stroke="#38bdf8" stroke-width="5"/>
    <line x1="250" y1="313" x2="346" y2="313" stroke="#e0f2fe" stroke-width="5" stroke-dasharray="6 4"/>
  </g>

  <!-- Lower Monogram Pill -->
  <rect x="186" y="380" width="140" height="64" rx="16" fill="#0e2a40" stroke="#38bdf8" stroke-width="6"/>
  <text x="256" y="425"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace"
        font-size="34"
        font-weight="900"
        fill="#bae6fd"
        text-anchor="middle"
        letter-spacing="4">BATE</text>
</svg>
