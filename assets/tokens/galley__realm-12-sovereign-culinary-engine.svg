<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Container Background (Deep Obsidian with 10% Terracotta Tint) -->
  <rect width="512" height="512" rx="112" fill="#150d0a"/>
  
  <!-- Outer Bezel Frame -->
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="#ea580c" stroke-width="14" stroke-opacity="0.9"/>
  
  <!-- Central Icon Glyph: Galley Prep Cleaver & Calibrated Workstation Surface -->
  <g id="icon-layer" stroke-linecap="round" stroke-linejoin="round">
    <!-- Precision Surface Grid Lines -->
    <line x1="140" y1="310" x2="372" y2="310" stroke="#ea580c" stroke-width="6" opacity="0.4"/>
    <line x1="170" y1="310" x2="170" y2="295" stroke="#ea580c" stroke-width="4" opacity="0.6"/>
    <line x1="210" y1="310" x2="210" y2="290" stroke="#ea580c" stroke-width="4" opacity="0.6"/>
    <line x1="256" y1="310" x2="256" y2="285" stroke="#ea580c" stroke-width="5" opacity="0.8"/>
    <line x1="302" y1="310" x2="302" y2="290" stroke="#ea580c" stroke-width="4" opacity="0.6"/>
    <line x1="342" y1="310" x2="342" y2="295" stroke="#ea580c" stroke-width="4" opacity="0.6"/>

    <!-- Chef's Cleaver Blade (Isometric Profile) -->
    <path d="M 155,140 L 320,110 L 320,240 L 155,270 Z" fill="#2a140d" stroke="#ea580c" stroke-width="10"/>
    
    <!-- Cutting Edge Hollow Grind -->
    <path d="M 155,270 L 320,240" stroke="#ffedd5" stroke-width="5"/>
    
    <!-- Weight Relief / Hanging Eyelet Void -->
    <circle cx="285" cy="145" r="14" fill="#150d0a" stroke="#ea580c" stroke-width="6"/>

    <!-- Tang & Bolster -->
    <path d="M 320,170 L 350,170 L 350,210 L 320,210 Z" fill="#ea580c"/>

    <!-- Ergonomic Wooden Handle -->
    <rect x="350" y="165" width="45" height="50" rx="10" fill="#7c2d12" stroke="#ea580c" stroke-width="6"/>
    <circle cx="372" cy="180" r="4" fill="#fed7aa"/>
    <circle cx="372" cy="200" r="4" fill="#fed7aa"/>

    <!-- Flame / Heat Vector Rays -->
    <path d="M 190,95 Q 200,75 210,95" fill="none" stroke="#f97316" stroke-width="6"/>
    <path d="M 235,90 Q 245,65 255,90" fill="none" stroke="#fb923c" stroke-width="6"/>
  </g>
  
  <!-- Lower Monogram Pill -->
  <rect x="186" y="380" width="140" height="64" rx="16" fill="#2d150e" stroke="#ea580c" stroke-width="6"/>
  <text x="256" y="425" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" 
        font-size="34" 
        font-weight="900" 
        fill="#ffedd5" 
        text-anchor="middle" 
        letter-spacing="4">GLY</text>
</svg>
