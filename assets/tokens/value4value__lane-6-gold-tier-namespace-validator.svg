<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Container Background -->
  <rect width="512" height="512" rx="112" fill="#140f07"/>

  <!-- Outer Bezel Frame -->
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="#f59e0b" stroke-width="14" stroke-opacity="0.9"/>

  <!-- Central Icon Glyph (Centered around X=256, Y=210) -->
  <g id="icon-layer" stroke-linecap="round" stroke-linejoin="round">
    <!-- Verification Shield -->
    <path d="M256 90 L346 128 V205 C346 268 256 318 256 318 C256 318 166 268 166 205 V128 Z"
          fill="#241908" stroke="#f59e0b" stroke-width="10"/>
    <!-- Central Lightning Bolt (Keysend Value Split Invariant) -->
    <polygon points="262,118 226,198 266,198 244,272 292,188 252,188"
             fill="#fbbf24"/>
    <!-- Conformance Check Pip -->
    <circle cx="256" cy="302" r="6" fill="#f59e0b"/>
  </g>

  <!-- Lower Monogram Pill -->
  <rect x="186" y="380" width="140" height="64" rx="16" fill="#291a05" stroke="#f59e0b" stroke-width="6"/>
  <text x="256" y="425"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace"
        font-size="34"
        font-weight="900"
        fill="#fde68a"
        text-anchor="middle"
        letter-spacing="4">V4V</text>
</svg>
