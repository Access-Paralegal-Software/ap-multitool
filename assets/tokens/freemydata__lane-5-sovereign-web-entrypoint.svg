    <rect x="160" y="115" width="192" height="190" rx="16" fill="#0b2416" stroke="#22c55e" stroke-width="10"/>
    <line x1="224" y1="115" x2="224" y2="305" stroke="#15803d" stroke-width="6"/>
    <line x1="288" y1="115" x2="288" y2="305" stroke="#15803d" stroke-width="6"/>
    <line x1="160" y1="180" x2="352" y2="180" stroke="#15803d" stroke-width="6"/>
