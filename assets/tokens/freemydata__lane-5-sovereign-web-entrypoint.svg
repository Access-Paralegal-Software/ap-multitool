<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Container Background -->
  <rect width="512" height="512" rx="112" fill="#07170e"/>
  
  <!-- Outer Bezel Frame -->
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="#22c55e" stroke-width="14" stroke-opacity="0.9"/>
  
  <!-- Central Icon Glyph -->
