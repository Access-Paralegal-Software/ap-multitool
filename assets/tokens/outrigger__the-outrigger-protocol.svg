<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Container Background -->
  <rect width="512" height="512" rx="112" fill="#09140f"/>
  
  <!-- Outer Bezel Frame -->
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="#10b981" stroke-width="14" stroke-opacity="0.9"/>
  
  <!-- Central Icon Glyph: Containment Boundary & Spar Isolation -->
  <g id="icon-layer" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Containment Boundary (Hexagonal Sandbox) -->
    <polygon points="256,92 344,142 344,244 256,294 168,244 168,142" 
             fill="none" stroke="#10b981" stroke-width="8" stroke-dasharray="14 10"/>
    
    <!-- Central Outrigger Keel Spar -->
    <line x1="256" y1="108" x2="256" y2="278" stroke="#34d399" stroke-width="10"/>
    
    <!-- Stabilizing Outrigger Cross-Spars -->
    <line x1="184" y1="193" x2="328" y2="193" stroke="#10b981" stroke-width="10"/>
    <line x1="202" y1="148" x2="310" y2="148" stroke="#059669" stroke-width="6"/>
    <line x1="202" y1="238" x2="310" y2="238" stroke="#059669" stroke-width="6"/>

    <!-- Isolated Outrigger Nodes (Bounded Sub-processes) -->
    <circle cx="168" cy="193" r="14" fill="#09140f" stroke="#34d399" stroke-width="8"/>
    <circle cx="344" cy="193" r="14" fill="#09140f" stroke="#34d399" stroke-width="8"/>
    <circle cx="256" cy="193" r="12" fill="#10b981"/>
  </g>
  
  <!-- Lower Monogram Pill -->
  <rect x="186" y="380" width="140" height="64" rx="16" fill="#11291f" stroke="#10b981" stroke-width="6"/>
  <text x="256" y="425" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" 
        font-size="34" 
        font-weight="900" 
        fill="#a7f3d0" 
        text-anchor="middle" 
        letter-spacing="4">OUT</text>
</svg>
