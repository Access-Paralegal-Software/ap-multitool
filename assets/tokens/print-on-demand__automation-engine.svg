<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Container Background -->
  <rect width="512" height="512" rx="112" fill="#180a13"/>

  <!-- Outer Bezel Frame -->
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="#ec4899" stroke-width="14" stroke-opacity="0.9"/>

  <!-- Central Icon Glyph (Centered at X: 256, Y: 210) -->
  <g id="icon-layer" stroke-linecap="round" stroke-linejoin="round">
    <!-- Substrate Sheet Flowing Through Rollers -->
    <path d="M190 85 H322 C338 85 352 98 352 115 V305 C352 322 338 335 322 335 H190 C174 335 160 322 160 305 V115 C160 98 174 85 190 85 Z"
          fill="#3b0720" stroke="#f472b6" stroke-width="8"/>

    <!-- Primary Upper Cylinder Roller -->
    <rect x="136" y="138" width="240" height="46" rx="12"
          fill="#831843" stroke="#fbcfe8" stroke-width="8"/>

    <!-- Lower Secondary Pin Roller -->
    <rect x="136" y="248" width="240" height="46" rx="12"
          fill="#831843" stroke="#fbcfe8" stroke-width="8"/>

    <!-- Laser Alignment Crosshairs (Vector Print Head Calibration) -->
    <circle cx="256" cy="216" r="24" fill="none" stroke="#fdf2f8" stroke-width="6"/>
    <circle cx="256" cy="216" r="6" fill="#ec4899"/>
    <line x1="256" y1="184" x2="256" y2="200" stroke="#fdf2f8" stroke-width="6"/>
    <line x1="256" y1="232" x2="256" y2="248" stroke="#fdf2f8" stroke-width="6"/>
    <line x1="224" y1="216" x2="240" y2="216" stroke="#fdf2f8" stroke-width="6"/>
    <line x1="272" y1="216" x2="288" y2="216" stroke="#fdf2f8" stroke-width="6"/>
  </g>

  <!-- Monogram Pill Container -->
  <rect x="186" y="380" width="140" height="64" rx="16" fill="#2a0d1d" stroke="#ec4899" stroke-width="6"/>
  <text x="256" y="425"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace"
        font-size="34"
        font-weight="900"
        fill="#fbcfe8"
        text-anchor="middle"
        letter-spacing="4">POD</text>
</svg>
