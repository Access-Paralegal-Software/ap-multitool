<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Container Background -->
  <rect width="512" height="512" rx="112" fill="#161108"/>
  <!-- Outer Bezel Frame -->
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="#f59e0b" stroke-width="14" stroke-opacity="0.9"/>
  <!-- Central Icon Glyph: Stdio NDJSON Loopback Shackle & Stream Gates -->
  <g id="icon-layer" stroke-linecap="round" stroke-linejoin="round">
    <!-- Stream Pipelines (Inbound Stdin / Outbound Stdout) -->
    <line x1="140" y1="165" x2="372" y2="165" stroke="#b45309" stroke-width="8" stroke-dasharray="12 10"/>
    <line x1="140" y1="255" x2="372" y2="255" stroke="#b45309" stroke-width="8" stroke-dasharray="12 10"/>
    <!-- Opposing Protocol Shackle Brackets -->
    <path d="M 215,130 L 165,130 C 145,130 145,290 165,290 L 215,290" fill="none" stroke="#f59e0b" stroke-width="12"/>
    <path d="M 297,130 L 347,130 C 367,130 367,290 347,290 L 297,290" fill="none" stroke="#f59e0b" stroke-width="12"/>
    <!-- Central Stdio Bus Pin Bolt -->
    <rect x="236" y="105" width="40" height="210" rx="8" fill="#78350f" stroke="#fbbf24" stroke-width="6"/>
    <!-- Data Framing Markers (JSON-RPC Delimiters) -->
    <circle cx="256" cy="145" r="7" fill="#fef3c7"/>
    <circle cx="256" cy="210" r="10" fill="#f59e0b" stroke="#fef3c7" stroke-width="3"/>
    <circle cx="256" cy="275" r="7" fill="#fef3c7"/>
  </g>
  <!-- Lower Monogram Pill -->
  <rect x="186" y="380" width="140" height="64" rx="16" fill="#2d1c06" stroke="#f59e0b" stroke-width="6"/>
  <text x="256" y="425" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="34" font-weight="900" fill="#fde68a" text-anchor="middle" letter-spacing="4">KPP</text>
</svg>
