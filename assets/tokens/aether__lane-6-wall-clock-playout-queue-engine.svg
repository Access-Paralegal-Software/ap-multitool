<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Container Background -->
  <rect width="512" height="512" rx="112" fill="#071217"/>

  <!-- Outer Bezel Frame -->
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="#06b6d4" stroke-width="14" stroke-opacity="0.9"/>

  <!-- Central Icon Glyph (Centered around X=256, Y=210) -->
  <g id="icon-layer" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer UTC Wall-Clock Ring -->
    <circle cx="256" cy="210" r="95" fill="none" stroke="#0891b2" stroke-width="8" stroke-dasharray="8 14"/>
    <!-- Deterministic Synced Orbit Track -->
    <circle cx="256" cy="210" r="68" fill="#0e2833" stroke="#06b6d4" stroke-width="6"/>
    <!-- Epoch Precision Ray Indicators -->
    <line x1="256" y1="210" x2="256" y2="145" stroke="#22d3ee" stroke-width="8"/>
    <line x1="256" y1="210" x2="308" y2="238" stroke="#22d3ee" stroke-width="8"/>
    <!-- Cohort Stream Marker -->
    <circle cx="256" cy="145" r="11" fill="#67e8f9" stroke="#0891b2" stroke-width="4"/>
    <circle cx="308" cy="238" r="9" fill="#67e8f9" stroke="#0891b2" stroke-width="3"/>
    <!-- Center Time-Base Hub -->
    <circle cx="256" cy="210" r="14" fill="#cffafe" stroke="#0891b2" stroke-width="4"/>
  </g>

  <!-- Lower Monogram Pill -->
  <rect x="186" y="380" width="140" height="64" rx="16" fill="#0b232e" stroke="#06b6d4" stroke-width="6"/>
  <text x="256" y="425"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace"
        font-size="34"
        font-weight="900"
        fill="#a5f3fc"
        text-anchor="middle"
        letter-spacing="4">SYNC</text>
</svg>
