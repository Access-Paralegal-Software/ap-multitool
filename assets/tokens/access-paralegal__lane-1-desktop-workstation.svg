<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Container Background -->
  <rect width="512" height="512" rx="112" fill="#09140e"/>

  <!-- Outer Bezel Frame -->
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="#22c55e" stroke-width="14" stroke-opacity="0.9"/>

  <!-- Central Icon Glyph: Dual-Pane Workstation & Native Execution Pulse -->
  <g id="icon-layer" stroke-linecap="round" stroke-linejoin="round">
    <!-- Workstation Window Shell -->
    <rect x="136" y="100" width="240" height="195" rx="14" fill="#112217" stroke="#22c55e" stroke-width="10"/>
    <!-- Window Header Bar -->
    <line x1="136" y1="140" x2="376" y2="140" stroke="#16a34a" stroke-width="6"/>
    <!-- Header Window Dots -->
    <circle cx="160" cy="120" r="5" fill="#4ade80"/>
    <circle cx="178" cy="120" r="5" fill="#16a34a"/>
    <circle cx="196" cy="120" r="5" fill="#16a34a"/>
    <!-- Dual Column Split -->
    <line x1="230" y1="140" x2="230" y2="295" stroke="#16a34a" stroke-width="6"/>
    <!-- Left Navigation Items -->
    <rect x="150" y="160" width="62" height="12" rx="3" fill="#22c55e" fill-opacity="0.8"/>
    <rect x="150" y="184" width="52" height="10" rx="3" fill="#16a34a" fill-opacity="0.6"/>
    <rect x="150" y="204" width="58" height="10" rx="3" fill="#16a34a" fill-opacity="0.6"/>
    <!-- Right Panel Document Queue Item -->
    <rect x="248" y="160" width="112" height="50" rx="6" fill="#143320" stroke="#4ade80" stroke-width="4"/>
    <line x1="262" y1="178" x2="330" y2="178" stroke="#86efac" stroke-width="4"/>
    <line x1="262" y1="192" x2="305" y2="192" stroke="#4ade80" stroke-width="4"/>
    <!-- Lower Active Process Indicator -->
    <path d="M252 250 L280 250 L292 235 L308 265 L320 250 L348 250" stroke="#22c55e" stroke-width="8" fill="none"/>
  </g>

  <!-- Lower Monogram Pill -->
  <rect x="186" y="380" width="140" height="64" rx="16" fill="#11291b" stroke="#22c55e" stroke-width="6"/>
  <text x="256" y="425"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace"
        font-size="34"
        font-weight="900"
        fill="#86efac"
        text-anchor="middle"
        letter-spacing="4">APM</text>
</svg>
