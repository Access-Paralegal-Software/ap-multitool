<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Container Background -->
  <rect width="512" height="512" rx="112" fill="#081510"/>
  
  <!-- Outer Bezel Frame -->
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="#10b981" stroke-width="14" stroke-opacity="0.9"/>
  
  <!-- Central Icon Glyph (Centered at X=256, Y=210) -->
  <g id="icon-layer" stroke-linecap="round" stroke-linejoin="round">
    <!-- Tree Graph Edges -->
    <line x1="256" y1="126" x2="186" y2="196" stroke="#10b981" stroke-width="10"/>
    <line x1="256" y1="126" x2="326" y2="196" stroke="#10b981" stroke-width="10"/>
    <line x1="186" y1="216" x2="146" y2="284" stroke="#059669" stroke-width="8"/>
    <line x1="186" y1="216" x2="226" y2="284" stroke="#059669" stroke-width="8"/>
    <line x1="326" y1="216" x2="326" y2="284" stroke="#059669" stroke-width="8"/>

    <!-- Root AST Node -->
    <circle cx="256" cy="116" r="22" fill="#052e1f" stroke="#34d399" stroke-width="8"/>
    
    <!-- Mid Tier Intermediate Nodes -->
    <circle cx="186" cy="206" r="18" fill="#052e1f" stroke="#10b981" stroke-width="7"/>
    <circle cx="326" cy="206" r="18" fill="#052e1f" stroke="#10b981" stroke-width="7"/>

    <!-- Leaf Nodes & Surgical Caliper Target -->
    <circle cx="146" cy="292" r="14" fill="#34d399"/>
    <circle cx="226" cy="292" r="14" fill="#34d399"/>
    
    <!-- Surgical Byte Insertion Highlight at (326, 292) -->
    <circle cx="326" cy="292" r="18" fill="#a7f3d0" stroke="#059669" stroke-width="6"/>
    <line x1="326" y1="278" x2="326" y2="306" stroke="#064e3b" stroke-width="4"/>
    <line x1="312" y1="292" x2="340" y2="292" stroke="#064e3b" stroke-width="4"/>
  </g>
  
  <!-- Lower Monogram Pill -->
  <rect x="186" y="380" width="140" height="64" rx="16" fill="#0c291f" stroke="#10b981" stroke-width="6"/>
  <text x="256" y="425" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" 
        font-size="34" 
        font-weight="900" 
        fill="#a7f3d0" 
        text-anchor="middle" 
        letter-spacing="4">CST</text>
</svg>