<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Container Background -->
  <rect width="512" height="512" rx="112" fill="#180f08"/>

  <!-- Outer Bezel Frame -->
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="#f97316" stroke-width="14" stroke-opacity="0.9"/>

  <!-- Central Icon Glyph (Centered at X: 256, Y: 210) -->
  <g id="icon-layer" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bag Handle Loop -->
    <path d="M216 142 V114 C216 92 234 74 256 74 C278 74 296 92 296 114 V142"
          fill="none" stroke="#fdba74" stroke-width="12"/>

    <!-- Outer Bag Body -->
    <path d="M156 146 L174 330 C176 340 184 348 195 348 H317 C328 348 336 340 338 330 L356 146 Z"
          fill="#431407" stroke="#f97316" stroke-width="10"/>

    <!-- Structural Rim Lip -->
    <line x1="144" y1="146" x2="368" y2="146" stroke="#fed7aa" stroke-width="10"/>

    <!-- Checkout Dispatch Lightning Inset -->
    <polygon points="266,168 226,242 258,242 246,316 294,228 262,228"
             fill="#ffedd5" stroke="#f97316" stroke-width="5"/>
  </g>

  <!-- Monogram Pill Container -->
  <rect x="186" y="380" width="140" height="64" rx="16" fill="#2a1208" stroke="#f97316" stroke-width="6"/>
  <text x="256" y="425"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace"
        font-size="34"
        font-weight="900"
        fill="#fdba74"
        text-anchor="middle"
        letter-spacing="4">SWS</text>
</svg>
