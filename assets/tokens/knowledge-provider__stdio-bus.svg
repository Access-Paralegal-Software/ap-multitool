<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Container Background -->
  <rect width="512" height="512" rx="112" fill="#071318"/>
  
  <!-- Outer Bezel Frame -->
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="#06b6d4" stroke-width="14" stroke-opacity="0.9"/>
  
  <!-- Central Icon Glyph (Centered at X=256, Y=210) -->
  <g id="icon-layer" stroke-linecap="round" stroke-linejoin="round">
    <!-- Upper Loopback Channel (stdin) -->
    <path d="M 160,230 L 160,150 Q 160,120 190,120 L 322,120 Q 352,120 352,150 L 352,175" 
          fill="none" stroke="#06b6d4" stroke-width="12"/>
    <polygon points="352,205 338,165 366,165" fill="#22d3ee"/>

    <!-- Lower Loopback Channel (stdout) -->
    <path d="M 352,190 L 352,270 Q 352,300 322,300 L 190,300 Q 160,300 160,270 L 160,245" 
          fill="none" stroke="#0891b2" stroke-width="12"/>
    <polygon points="160,215 174,255 146,255" fill="#67e8f9"/>

    <!-- Central NDJSON Serializer Node -->
    <rect x="220" y="174" width="72" height="72" rx="14" fill="#0e2a35" stroke="#22d3ee" stroke-width="8"/>
    <line x1="236" y1="198" x2="276" y2="198" stroke="#cffafe" stroke-width="6"/>
    <line x1="236" y1="222" x2="264" y2="222" stroke="#cffafe" stroke-width="6"/>
  </g>
  
  <!-- Lower Monogram Pill -->
  <rect x="186" y="380" width="140" height="64" rx="16" fill="#0b232c" stroke="#06b6d4" stroke-width="6"/>
  <text x="256" y="425" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" 
        font-size="34" 
        font-weight="900" 
        fill="#cffafe" 
        text-anchor="middle" 
        letter-spacing="4">KPP</text>
</svg>