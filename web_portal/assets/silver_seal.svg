<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="silverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#C0C0C0;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#E8E8E8;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#A0A0A0;stop-opacity:1" />
        </linearGradient>
        <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
            <feOffset dx="2" dy="2" result="offsetblur" />
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.3" />
            </feComponentTransfer>
            <feMerge>
                <feMergeNode />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>
    
    <!-- The Seal Body -->
    <circle cx="100" cy="100" r="90" fill="url(#silverGradient)" filter="url(#dropShadow)" stroke="#808080" stroke-width="2"/>
    <circle cx="100" cy="100" r="82" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="4,2" opacity="0.6"/>
    
    <!-- Text Ring -->
    <path id="circlePath" d="M 100, 100 m -65, 0 a 65,65 0 1,1 130,0 a 65,65 0 1,1 -130,0" fill="none" />
    <text font-family="Outfit, sans-serif" font-size="12" font-weight="800" fill="#4B5563" letter-spacing="1">
        <textPath href="#circlePath" startOffset="50%" text-anchor="middle">
            ACCESS PARALEGAL MULTITOOL • ACCESS PARALEGAL MULTITOOL •
        </textPath>
    </text>
    
    <!-- Central Monogram -->
    <text x="100" y="115" font-family="Outfit, sans-serif" font-size="48" font-weight="900" fill="#2D3748" text-anchor="middle" style="text-shadow: 1px 1px 0px rgba(255,255,255,0.8);">
        AP
    </text>
    
    <!-- Inner Decoration -->
    <path d="M 70 130 L 130 130" stroke="#4B5563" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
</svg>
