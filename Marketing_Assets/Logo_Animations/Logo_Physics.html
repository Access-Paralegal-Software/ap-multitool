<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Paralegal - Logo Physics</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
        }
        .overlay {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #00ff88;
            font-size: 14px;
            letter-spacing: 2px;
            opacity: 0.5;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="overlay">Access Paralegal // Branding Engine v1.0</div>

    <script>
        const { Engine, Render, Runner, Bodies, Composite, Mouse, MouseConstraint, Constraint } = Matter;

        const engine = Engine.create();
        const render = Render.create({
            element: document.getElementById('canvas-container'),
            engine: engine,
            options: {
                width: window.innerWidth,
                height: window.innerHeight,
                wireframes: false,
                background: 'transparent'
            }
        });

        const ground = Bodies.rectangle(window.innerWidth/2, window.innerHeight + 50, window.innerWidth, 100, { isStatic: true });
        const leftWall = Bodies.rectangle(-50, window.innerHeight/2, 100, window.innerHeight, { isStatic: true });
        const rightWall = Bodies.rectangle(window.innerWidth + 50, window.innerHeight/2, 100, window.innerHeight, { isStatic: true });
        const ceiling = Bodies.rectangle(window.innerWidth/2, -50, window.innerWidth, 100, { isStatic: true });

        // Create Logo Pieces (Simplified "A" and "P")
        const createLogo = () => {
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            
            // "A" pieces - Emerald Green
            const a1 = Bodies.rectangle(centerX - 40, centerY, 20, 150, { 
                chamfer: { radius: 10 },
                render: { fillStyle: '#00ff88', strokeStyle: '#00cc66', lineWidth: 2 } 
            });
            const a2 = Bodies.rectangle(centerX + 40, centerY, 20, 150, { 
                chamfer: { radius: 10 },
                render: { fillStyle: '#00ff88', strokeStyle: '#00cc66', lineWidth: 2 } 
            });
            const a3 = Bodies.rectangle(centerX, centerY - 40, 100, 20, { 
                chamfer: { radius: 10 },
                render: { fillStyle: '#00ff88', strokeStyle: '#00cc66', lineWidth: 2 } 
            });

            // "P" pieces - Silver/Silver-Blue
            const p1 = Bodies.rectangle(centerX + 120, centerY, 20, 150, { 
                chamfer: { radius: 10 },
                render: { fillStyle: '#c0c0c0', strokeStyle: '#808080', lineWidth: 2 } 
            });
            const p2 = Bodies.circle(centerX + 160, centerY - 40, 40, { 
                render: { fillStyle: '#c0c0c0', strokeStyle: '#808080', lineWidth: 2 } 
            });

            Composite.add(engine.world, [a1, a2, a3, p1, p2]);
        };

        createLogo();
        Composite.add(engine.world, [ground, leftWall, rightWall, ceiling]);

        // Add mouse control
        const mouse = Mouse.create(render.canvas);
        const mouseConstraint = MouseConstraint.create(engine, {
            mouse: mouse,
            constraint: {
                stiffness: 0.2,
                render: { visible: false }
            }
        });

        Composite.add(engine.world, mouseConstraint);
        render.mouse = mouse;

        Render.run(render);
        const runner = Runner.create();
        Runner.run(runner, engine);

        // Shake logic for more "cool physics"
        setInterval(() => {
            engine.gravity.x = (Math.random() - 0.5) * 2;
            engine.gravity.y = (Math.random() - 0.5) * 2;
        }, 3000);
    </script>
</body>
</html>
