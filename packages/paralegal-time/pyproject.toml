[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paralegal-time"
version = "0.1.0"
description = "Multi-firm timer rules and LEDES 1998B legal billing formatters"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/paralegal_time"]
