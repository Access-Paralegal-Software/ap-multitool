[pytest]
addopts = -v --tb=short
testpaths = tests

markers =
    slow: marks tests as slow-running — deselect with -m "not slow"
    integration: marks tests that exercise multiple components end-to-end
    qt: marks tests that require a running QApplication / PySide6 display
    cli: marks tests that invoke the CLI via subprocess
    core: marks tests of the core headless engine (no UI dependency)
    telemetry: marks tests of the telemetry subsystem
    packaging: marks tests that verify installer/packaging scripts (Windows-relevant)
    smoke: marks quick sanity checks for critical import and wiring paths
    conversion: marks tests for the document conversion subsystem (docx/xlsx to PDF)
    libreoffice: marks integration tests that require LibreOffice (soffice on PATH) — skip with -m "not libreoffice"
    integration_windows: marks tests that require Windows OS and Microsoft Office installed
    integration_libreoffice: alias for libreoffice marker — used by legacy conftest registration
